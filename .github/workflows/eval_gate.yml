name: RAGAS Eval Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Activate venv and run RAGAS eval
        run: |
          source /Users/saravanansankar/Developer/local-ai-stack/local-ai-stack-venv/bin/activate
          python -m src.evaluation.evaluator --full